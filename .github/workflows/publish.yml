name: Publish posts
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no posts/drafts created, only logs)'
        type: boolean
        default: false
jobs:
  publish:
    uses: bilardi/github-actions-publish/.github/workflows/publish.yml@v0.2.1
    with:
      dry_run: ${{ inputs.dry_run }}
    secrets:
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
